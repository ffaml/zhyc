
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TagBox - 移动端优化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 基础重置与滚动条美化 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        
        /* 移动端触控优化：增大点击热区 */
        .touch-target {
            min-height: 44px;
            min-width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 登录遮罩层无闪烁处理 */
        #auth-overlay {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #auth-overlay.show {
            display: flex;
            opacity: 1;
        }

        /* 隐藏类 */
        .hidden-important { display: none !important; }
        
        /* 动画 */
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 移动端底部安全区适配 */
        .safe-pb { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen relative overflow-x-hidden">

    <!-- 1. 密码验证遮罩层 -->
    <div id="auth-overlay" class="fixed inset-0 z-50 bg-gray-900/90 backdrop-blur-md items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm fade-in border border-gray-200 overflow-hidden">
            <div class="p-6 text-center bg-gradient-to-b from-indigo-50 to-white">
                <div class="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4 ring-4 ring-white shadow-sm">
                    <i class="fa-solid fa-shield-halved text-3xl text-indigo-600"></i>
                </div>
                <h2 class="text-xl font-bold text-gray-900">安全访问</h2>
                <p class="text-gray-500 mt-1 text-sm">请输入密码解锁 TagBox</p>
            </div>
            
            <form id="auth-form" onsubmit="handleAuth(event)" class="p-6 space-y-4">
                <div class="relative">
                    <input type="password" id="auth-password" 
                           class="block w-full px-4 py-3 border border-gray-300 rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-lg tracking-widest text-center" 
                           placeholder="••••••" autocomplete="current-password" autofocus>
                </div>
                
                <div id="auth-error" class="text-red-500 text-sm text-center hidden bg-red-50 py-2 rounded-lg border border-red-100">
                    <i class="fa-solid fa-circle-exclamation mr-1"></i> 密码错误
                </div>

                <button type="submit" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold shadow-lg shadow-indigo-200 active:scale-95 transition-transform touch-target">
                    立即解锁
                </button>
            </form>
            
            <div class="px-6 pb-6 text-center">
                <p class="text-xs text-gray-400">默认密码: 123456</p>
            </div>
        </div>
    </div>

    <!-- 2. 主应用内容 -->
    <div id="app-content" class="hidden-important flex flex-col min-h-screen w-full">
        <!-- 头部导航 -->
        <header class="bg-white/80 backdrop-blur-md sticky top-0 z-30 border-b border-gray-100 safe-pb">
            <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-md">
                        <i class="fa-solid fa-tags text-sm"></i>
                    </div>
                    <h1 class="text-lg font-bold text-gray-900">TagBox</h1>
                </div>
                <div class="flex items-center space-x-1">
                    <button onclick="exportData()" class="w-10 h-10 flex items-center justify-center text-gray-500 hover:bg-gray-100 rounded-full transition touch-target">
                        <i class="fa-solid fa-file-export"></i>
                    </button>
                    <button onclick="openModal()" class="w-10 h-10 flex items-center justify-center bg-indigo-600 text-white rounded-full shadow-md hover:bg-indigo-700 active:scale-95 transition touch-target">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                    <button onclick="logout()" class="w-10 h-10 flex items-center justify-center text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-full transition touch-target">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- 主内容区 -->
        <main class="flex-grow max-w-7xl mx-auto px-4 py-4 w-full safe-pb">
            <!-- 搜索与筛选 -->
            <div class="mb-4 space-y-3">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
                    </div>
                    <input type="text" id="search-input" 
                           class="block w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all" 
                           placeholder="搜索标签、备注或链接...">
                </div>
                
                <div class="flex space-x-2 overflow-x-auto pb-2 no-scrollbar" id="category-filters">
                    <button onclick="filterByCategory('all')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-indigo-600 text-white shadow-sm transition whitespace-nowrap touch-target" data-category="all">全部</button>
                    <button onclick="filterByCategory('work')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition whitespace-nowrap touch-target" data-category="work">工作</button>
                    <button onclick="filterByCategory('study')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition whitespace-nowrap touch-target" data-category="study">学习</button>
                    <button onclick="filterByCategory('life')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition whitespace-nowrap touch-target" data-category="life">生活</button>
                </div>
            </div>

            <!-- 标签网格 (移动端单列，桌面端多列) -->
            <div id="tags-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- 动态内容 -->
            </div>
            
            <!-- 空状态 -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-12 text-center">
                <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mb-3">
                    <i class="fa-regular fa-folder-open text-2xl text-gray-400"></i>
                </div>
                <p class="text-gray-500 text-sm">暂无数据，点击右上角 + 新建</p>
            </div>
        </main>
        
        <!-- 页脚 -->
        <footer class="bg-white border-t py-3 mt-auto safe-pb">
            <div class="max-w-7xl mx-auto px-4 text-center text-xs text-gray-400 flex justify-center items-center space-x-4">
                <span><i class="fa-solid fa-users mr-1"></i>在线: <b id="visitor-stats">0</b></span>
                <span>|</span>
                <span><i class="fa-regular fa-clock mr-1"></i><span id="current-time">--:--</span></span>
            </div>
        </footer>
    </div>

    <!-- 模态框 (移动端全屏/底部弹出优化) -->
    <div id="tag-modal" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end sm:items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity backdrop-blur-sm" onclick="closeModal()"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            
            <!-- 移动端底部滑出风格，桌面端居中 -->
            <div class="inline-block align-bottom bg-white rounded-t-2xl sm:rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full sm:rounded-2xl">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6">
                    <div class="sm:flex sm:items-start">
                        <div class="mt-3 text-center sm:mt-0 sm:text-left w-full">
                            <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4" id="modal-title">编辑标签</h3>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-xs font-medium text-gray-700 mb-1">内容</label>
                                    <input type="text" id="tag-content" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" placeholder="标签名称">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-gray-700 mb-1">链接 (可选)</label>
                                    <input type="url" id="tag-url" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" placeholder="https://...">
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-medium text-gray-700 mb-1">分类</label>
                                        <select id="tag-category" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                                            <option value="work">工作</option>
                                            <option value="study">学习</option>
                                            <option value="life">生活</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-medium text-gray-700 mb-1">颜色</label>
                                        <div class="flex items-center border border-gray-300 rounded-lg px-2 py-1.5 bg-white">
                                            <input type="color" id="tag-color" class="w-6 h-6 rounded cursor-pointer border-none p-0" value="#4F46E5">
                                            <span class="ml-2 text-xs text-gray-500">选择色值</span>
                                        </div>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-gray-700 mb-1">备注</label>
                                    <textarea id="tag-note" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="添加备注信息..."></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse safe-pb">
                    <button onclick="saveTag()" class="w-full inline-flex justify-center rounded-lg border border-transparent shadow-sm px-4 py-2.5 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 focus:outline-none sm:ml-3 sm:w-auto sm:text-sm touch-target">保存</button>
                    <button onclick="closeModal()" class="mt-3 w-full inline-flex justify-center rounded-lg border border-gray-300 shadow-sm px-4 py-2.5 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm touch-target">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 z-50 bg-gray-800 text-white px-4 py-2 rounded-full shadow-lg flex items-center text-sm">
        <i class="fa-solid fa-check-circle text-green-400 mr-2"></i>
        <span id="toast-message">操作成功</span>
    </div>

    <script>
        // --- 核心配置 ---
        const STORED_HASH = "8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92"; // 123456
        
        let tags = [];
        let currentFilter = 'all';
        let editingId = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            updateStats();
        });

        // 认证检查
        function checkAuth() {
            const isAuthed = sessionStorage.getItem('tagbox_auth');
            const overlay = document.getElementById('auth-overlay');
            const appContent = document.getElementById('app-content');

            if (isAuthed === 'true') {
                overlay.classList.remove('show');
                appContent.classList.remove('hidden-important');
                loadTags();
                renderTags();
            } else {
                overlay.classList.add('show');
                appContent.classList.add('hidden-important');
                setTimeout(() => document.getElementById('auth-password').focus(), 100);
            }
        }

        // 哈希计算
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // 登录处理
        async function handleAuth(e) {
            e.preventDefault();
            const inputPwd = document.getElementById('auth-password').value;
            const errorDiv = document.getElementById('auth-error');
            const btn = e.target.querySelector('button');
            
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
            btn.disabled = true;

            const inputHash = await sha256(inputPwd);

            setTimeout(() => {
                if (inputHash === STORED_HASH) {
                    sessionStorage.setItem('tagbox_auth', 'true');
                    errorDiv.classList.add('hidden');
                    const overlay = document.getElementById('auth-overlay');
                    const appContent = document.getElementById('app-content');
                    
                    overlay.style.opacity = '0';
                    setTimeout(() => {
                        overlay.classList.remove('show');
                        appContent.classList.remove('hidden-important');
                        loadTags();
                        renderTags();
                    }, 300);
                } else {
                    errorDiv.classList.remove('hidden');
                    document.getElementById('auth-password').value = '';
                    document.getElementById('auth-password').focus();
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            }, 300);
        }

        function logout() {
            sessionStorage.removeItem('tagbox_auth');
            location.reload();
        }

        // 数据加载
        function loadTags() {
            const stored = localStorage.getItem('tagbox_data');
            tags = stored ? JSON.parse(stored) : [
                { id: 1, content: 'Google', url: 'https://google.com', category: 'work', color: '#3B82F6', note: '搜索引擎', createdAt: Date.now() },
                { id: 2, content: 'TailwindCSS', url: 'https://tailwindcss.com', category: 'study', color: '#06B6D4', note: '实用优先的 CSS 框架', createdAt: Date.now() }
            ];
        }

        // 渲染标签 (支持移动端单列布局)
        function renderTags() {
            const container = document.getElementById('tags-container');
            const emptyState = document.getElementById('empty-state');
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            
            container.innerHTML = '';
            
            const filtered = tags.filter(t => {
                const matchCat = currentFilter === 'all' || t.category === currentFilter;
                const contentMatch = t.content.toLowerCase().includes(searchVal);
                const noteMatch = t.note ? t.note.toLowerCase().includes(searchVal) : false;
                const urlMatch = t.url ? t.url.toLowerCase().includes(searchVal) : false;
                return matchCat && (contentMatch || noteMatch || urlMatch);
            });

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
                filtered.forEach(tag => {
                    const div = document.createElement('div');
                    // 移动端卡片样式优化：更大的内边距和点击区域
                    div.className = 'bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition group fade-in flex flex-col';
                    const hasUrl = tag.url && tag.url.startsWith('http');
                    
                    div.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex items-center space-x-3 overflow-hidden flex-1">
                                <div class="w-1.5 h-10 rounded-full shrink-0" style="background:${tag.color}"></div>
                                <div class="min-w-0 flex-1">
                                    ${hasUrl 
                                        ? `<a href="${tag.url}" target="_blank" class="font-semibold text-gray-800 hover:text-indigo-600 truncate block text-lg">${tag.content} <i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-gray-400 ml-1"></i></a>`
                                        : `<div class="font-semibold text-gray-800 truncate text-lg">${tag.content}</div>`
                                    }
                                    <div class="text-xs text-gray-400 mt-1 flex items-center gap-2">
                                        <span class="bg-gray-100 px-1.5 py-0.5 rounded text-[10px] uppercase tracking-wide">${tag.category}</span>
                                        <span>${new Date(tag.createdAt).toLocaleDateString()}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex space-x-1 ml-2 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                                <button onclick="editTag(${tag.id})" class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-full touch-target"><i class="fa-solid fa-pen text-xs"></i></button>
                                <button onclick="deleteTag(${tag.id})" class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-full touch-target"><i class="fa-solid fa-trash text-xs"></i></button>
                            </div>
                        </div>
                        ${tag.note ? `<p class="text-sm text-gray-600 line-clamp-2 mb-3 bg-gray-50 p-2 rounded border border-gray-100">${tag.note}</p>` : ''}
                        <button onclick="copyToClipboard('${hasUrl ? tag.url.replace(/'/g, "\\'") : tag.content.replace(/'/g, "\\'")}')" class="mt-auto w-full text-sm bg-gray-50 hover:bg-indigo-50 text-gray-600 py-2.5 rounded-lg border border-gray-100 transition flex items-center justify-center font-medium touch-target">
                            <i class="fa-regular fa-copy mr-2"></i> ${hasUrl ? '复制链接' : '复制内容'}
                        </button>
                    `;
                    container.appendChild(div);
                });
            }
        }

        // 模态框控制
        function openModal(isEdit = false) {
            document.getElementById('tag-modal').classList.remove('hidden');
            if(!isEdit) {
                document.getElementById('tag-content').value = '';
                document.getElementById('tag-url').value = '';
                document.getElementById('tag-note').value = '';
                document.getElementById('tag-color').value = '#4F46E5';
                editingId = null;
            }
        }
        function closeModal() { document.getElementById('tag-modal').classList.add('hidden'); }
        
        function saveTag() {
            const content = document.getElementById('tag-content').value;
            if(!content) return showToast('内容不能为空', true);
            
            const newTag = {
                id: editingId || Date.now(),
                content: content,
                url: document.getElementById('tag-url').value,
                category: document.getElementById('tag-category').value,
                color: document.getElementById('tag-color').value,
                note: document.getElementById('tag-note').value,
                createdAt: editingId ? tags.find(t=>t.id===editingId).createdAt : Date.now()
            };

            if(editingId) {
                const idx = tags.findIndex(t => t.id === editingId);
                tags[idx] = newTag;
            } else {
                tags.push(newTag);
            }
            localStorage.setItem('tagbox_data', JSON.stringify(tags));
            renderTags();
            closeModal();
            showToast('保存成功');
        }

        function editTag(id) {
            const t = tags.find(x => x.id === id);
            editingId = id;
            document.getElementById('tag-content').value = t.content;
            document.getElementById('tag-url').value = t.url || '';
            document.getElementById('tag-category').value = t.category;
            document.getElementById('tag-color').value = t.color;
            document.getElementById('tag-note').value = t.note || '';
            openModal(true);
        }

        function deleteTag(id) {
            if(confirm('确定删除此标签吗？')) {
                tags = tags.filter(t => t.id !== id);
                localStorage.setItem('tagbox_data', JSON.stringify(tags));
                renderTags();
                showToast('已删除');
            }
        }

        function filterByCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                if(btn.dataset.category === cat) {
                    btn.className = "category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-indigo-600 text-white shadow-sm transition whitespace-nowrap touch-target";
                } else {
                    btn.className = "category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 transition whitespace-nowrap touch-target";
                }
            });
            renderTags();
        }

        document.getElementById('search-input').addEventListener('input', renderTags);

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板'));
        }

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            const icon = t.querySelector('i');
            document.getElementById('toast-message').innerText = msg;
            
            if(isError) {
                icon.className = 'fa-solid fa-circle-exclamation text-red-400 mr-2';
            } else {
                icon.className = 'fa-solid fa-check-circle text-green-400 mr-2';
            }

            t.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 2000);
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tags));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = "tags_backup.json";
            a.click();
            showToast('导出成功');
        }

        function updateStats() {
            document.getElementById('visitor-stats').innerText = Math.floor(Math.random() * 100) + 1;
            setInterval(() => {
                const now = new Date();
                document.getElementById('current-time').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            }, 1000);
        }
    </script>
</body>
</html>
